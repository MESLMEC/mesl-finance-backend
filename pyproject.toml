[project]
name = "mesl-finance-backend"
version = "0.1.0"
description = "MESL lab finance backend (FastAPI, clean architecture, PostgreSQL-owned rules)"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pydantic-settings",
    "pyjwt",
    "argon2-cffi",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "pyright", "asyncpg-stubs"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"  # keep `except (A, B):` parenthesized; works on 3.13+ incl. 3.15
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S608"]   # asserts, test passwords, SQL built in test helpers

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
