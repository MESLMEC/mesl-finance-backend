# MESL Finance: Alembic configuration.
# One migration script directory (alembic/versions/); the environment that runs
# migrations is alembic/env.py (async, owner DSN from the environment, never here).

[alembic]
script_location = alembic
path_separator = os
prepend_sys_path = .
# Where generated revision files land; guard tests (step 1.5) live beside them.
version_locations = alembic/versions
truncate_slug_length = 40
output_encoding = utf-8
# NO sqlalchemy.url here: the owner DSN comes from the MESL_ADMIN_DATABASE_URL
# environment variable only (read by alembic/env.py). Never written to disk.

# ruff-format and lint freshly generated revision files
[post_write_hooks]
hooks = ruff.format,ruff.check
ruff.format.type = module
ruff.format.module = ruff
ruff.format.options = format REVISION_SCRIPT_FILENAME
ruff.check.type = module
ruff.check.module = ruff
ruff.check.options = check --fix REVISION_SCRIPT_FILENAME

# Logging configuration, consumed by alembic/env.py fileConfig().
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
